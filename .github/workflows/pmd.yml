name: PMD Analysis

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:  # Ermöglicht manuelles Starten

jobs:
  pmd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run PMD Analysis
        run: mvn pmd:pmd

      - name: Upload PMD Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: '**/target/pmd.xml'
          retention-days: 7
